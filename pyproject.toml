[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-image-sanitizer"
version = "0.1.0"
authors = [
  { name="Mukesh Lekhak", email="lekhak_mukesh@live.com" },
]
description = "A Django middleware to automatically sanitize and convert uploaded images to WebP to prevent XSS and save space."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Django>=3.2",
    "Pillow>=9.0.0"
]

[project.urls]
"Homepage" = "https://github.com/lekhakmukesh/django-image-sanitizer"